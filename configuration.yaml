# Loads default set of integrations. Do not remove.
default_config:

logger:
  default: warning
  logs:
    custom_components.marstek_cloud: debug
    custom_components.renson_test: debug
    custom_components.marstek_local_api: debug

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.18.0.2      # my swag container
    - 192.168.0.1     # if my router is seen as the source

google_assistant:
  project_id: home-assistant-dc320
  service_account: !include SERVICE_ACCOUNT.json
  report_state: true

template:
  - sensor:
        
        # =========================
        # Sensors for Easee charging
        # =========================
        
      - name: Easee Charging Mode Readonly
        state: "{{ states('input_select.easee_charging_mode') }}"
        icon: mdi:ev-station

      - name: Easee Dynamic Current Readonly
        state: "{{ states('input_number.easee_dynamic_current') | int }}"
        unit_of_measurement: "A"
        icon: mdi:current-ac
        
        # =========================
        # Sensors for Marstek Batteries
        # =========================
        
      - name: marstek_power_import
        unique_id: sensor.marstek_power_import
        state: >
          {% set power1 = states('sensor.plug_1_power') | float(0) %}
          {% set power2 = states('sensor.plug_2_power') | float(0) %}
          {{ (power1 + power2) }}
        unit_of_measurement: W
        icon: mdi:battery-charging-60

# =========================
# Helpers for Easee charging
# =========================
input_number:
  easee_dynamic_current:
    name: Easee Dynamic Current
    min: 0
    max: 32
    step: 1
    initial: 6
    unit_of_measurement: A
    icon: mdi:current-ac

input_select:
  easee_charging_mode:
    name: Easee Charging Mode
    options:
      - Default
      - Boost
      - Solar only
    icon: mdi:ev-station

# =========================
# Scripts for Easee charging
# =========================

# Scripts for Easee Charging modes

script:
  easee_mode_default:
    alias: Easee Default
    sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.easee_dynamic_current
          value: 6
      - service: input_select.select_option
        data:
          entity_id: input_select.easee_charging_mode
          option: "Default"

  easee_mode_boost:
    alias: Easee Boost
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.easee_charging_mode
          option: "Boost"

  easee_mode_solar_only:
    alias: Easee Solar Only
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.easee_charging_mode
          option: "Solar only"
          
# Automations to toggle modes from Shelly button presses

automation:
  - id: shelly_input0_btn_down_toggle_solar
    alias: "Shelly Input 0 btn_down toggles Solar mode"
    mode: single
    trigger:
      - platform: event
        event_type: shelly.click
    condition:
      - condition: template
        value_template: >
          {% set d = trigger.event.data %}
          {% if (d.device_id or d.device or d.id) != '37ec3fb6778e2eac581777efb3bfbaad' %}
            {{ false }}
          {% else %}
            {{ (d.click_type|string).lower() == 'btn_down' and (d.channel is not none and (d.channel|int) == 1) }}
          {% endif %}
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.easee_charging_mode
                state: "Solar only"
            sequence:
              - service: script.easee_mode_default
          - conditions:
              - condition: state
                entity_id: input_select.easee_charging_mode
                state: "Boost"
            sequence:
              - service: script.easee_mode_solar_only
        default:
          - service: script.easee_mode_solar_only

  - id: shelly_input1_btn_down_toggle_boost
    alias: "Shelly Input 1 btn_down toggles Boost mode"
    mode: single
    trigger:
      - platform: event
        event_type: shelly.click
    condition:
      - condition: template
        value_template: >
          {% set d = trigger.event.data %}
          {% if (d.device_id or d.device or d.id) != '37ec3fb6778e2eac581777efb3bfbaad' %}
            {{ false }}
          {% else %}
            {{ (d.click_type|string).lower() == 'btn_down' and (d.channel is not none and (d.channel|int) == 2) }}
          {% endif %}
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.easee_charging_mode
                state: "Boost"
            sequence:
              - service: script.easee_mode_default
          - conditions:
              - condition: state
                entity_id: input_select.easee_charging_mode
                state: "Solar only"
            sequence:
              - service: script.easee_mode_boost
        default:
          - service: script.easee_mode_boost


# Automations to keep Shelly outputs (LEDs) in sync with the selected mode

  - alias: "Sync Shelly outputs to Easee mode"
    id: sync_shelly_outputs_to_easee_mode
    trigger:
      - platform: state
        entity_id: input_select.easee_charging_mode
      - platform: homeassistant
        event: start
    action:
      - wait_template: >
          {{ states('switch.shellypro2_ec62609eaa2c_output_0') not in ['unknown','unavailable'] and
             states('switch.shellypro2_ec62609eaa2c_output_1') not in ['unknown','unavailable'] }}
        timeout: '00:00:30'
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.easee_charging_mode
                state: "Default"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id:
                    - switch.shellypro2_ec62609eaa2c_output_0
                    - switch.shellypro2_ec62609eaa2c_output_1
          - conditions:
              - condition: state
                entity_id: input_select.easee_charging_mode
                state: "Solar only"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.shellypro2_ec62609eaa2c_output_0
              - service: switch.turn_off
                target:
                  entity_id: switch.shellypro2_ec62609eaa2c_output_1
          - conditions:
              - condition: state
                entity_id: input_select.easee_charging_mode
                state: "Boost"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.shellypro2_ec62609eaa2c_output_1
              - service: switch.turn_off
                target:
                  entity_id: switch.shellypro2_ec62609eaa2c_output_0
